<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目集合 - weiyingjun.top</title>
    <link rel="preconnect" href="https://weiyingjun.top">
    <link rel="dns-prefetch" href="https://weiyingjun.top">
    <link rel="stylesheet" href="/mumuy/static/style/common.css">
    <style>
        body { background: #f5f5f5; }
        .project-grid { max-width: 1200px; margin: 0 auto; padding: 30px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .project-card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; text-decoration: none; color: inherit; display: block; }
        .project-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
        .project-card img { width: 100%; height: 180px; object-fit: cover; }
        .project-info { padding: 16px; }
        .project-info h3 { margin: 0 0 6px; font-size: 18px; color: #333; }
        .project-info p { margin: 0; font-size: 14px; color: #888; line-height: 1.5; }
        .page-header { max-width: 1200px; margin: 0 auto; padding: 40px 20px 0; }
        .page-header h1 { font-size: 28px; color: #333; margin: 0 0 8px; }
        .page-header p { font-size: 15px; color: #888; margin: 0; }
    </style>
</head>
<body>
    <div class="page-header">
        <h1>项目集合</h1>
        <p>收录自 <a href="https://github.com/mumuy" target="_blank">mumuy</a> 的开源项目</p>
    </div>
    <div class="project-grid" id="projectGrid"></div>

    <script>
        const projects = [
            { name: '亲戚计算器', path: 'relationship', desc: '中国亲戚关系计算 - 家庭称谓/辈分计算', img: '/mumuy/static/image/index/project/relationship.png' },
            { name: '吃豆人游戏', path: 'pacman', desc: '经典游戏 HTML5 复刻，智能围堵算法', img: '/mumuy/static/image/index/project/pacman.png' },
            { name: '五子棋对战', path: 'gobang', desc: '玩家和电脑进行五子棋对战游戏', img: '/mumuy/static/image/index/project/gobang.png' },
            { name: '中华万年历', path: 'calendar', desc: '方便查询农历和公历生日及节假日', img: '/mumuy/static/image/index/project/calendar.png' },
            { name: '中国行政区划数据', path: 'data_location', desc: '省、市、区县行政区划代码数据', img: '/mumuy/static/image/index/project/data_location.png' },
            { name: '浏览器检测', path: 'browser', desc: 'Useragent 分析/浏览器识别/设备指纹', img: '/mumuy/static/image/index/project/browser.png' },
            { name: '二维码美化组件', path: 'widget-qrcode', desc: '二维码实时根据内容变化，支持美化', img: '/mumuy/static/image/index/project/widget-qrcode.png' },
            { name: '身份证号码解析', path: 'idcard', desc: '身份证号验证/解析/信息提取', img: '/mumuy/static/image/index/project/idcard.png' },
            { name: '21 点游戏', path: 'blackjack', desc: 'Blackjack 扑克牌游戏', img: '/mumuy/static/image/index/project/blackjack.png' },
            { name: '24 点游戏', path: 'calc24', desc: '24 点算术游戏', img: '/mumuy/static/image/index/project/calc24.png' },
            { name: '简繁转换', path: 'chinese-transverter', desc: '简体中文/繁体中文转换', img: '/mumuy/static/image/index/project/chinese-transverter.png' },
        ];

        const grid = document.getElementById('projectGrid');
        projects.forEach(p => {
            const card = document.createElement('a');
            card.className = 'project-card';
            card.href = `/mumuy/${p.path}/`;
            card.innerHTML = `
                <img src="${p.img}" alt="${p.name}" onerror="this.style.display='none'">
                <div class="project-info">
                    <h3>${p.name}</h3>
                    <p>${p.desc}</p>
                </div>
            `;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
