<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>公众号机器人消息记录</title>
<meta property="og:image" content="https://www.weiyingjun.top/static/logo.svg">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", -apple-system, sans-serif; background: linear-gradient(135deg,#fdf2f8,#eff6ff); min-height: 100vh; color: #1f2d3d; padding: 20px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 16px; }
  h1 span { color: #db2777; }
  .card { background: #fff; border-radius: 14px; box-shadow: 0 2px 10px rgba(30,41,59,.06); padding: 16px 18px; margin-bottom: 16px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
  input, select { padding: 7px 10px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; outline: none; }
  input:focus, select:focus { border-color: #db2777; }
  button { padding: 7px 14px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; background: #db2777; color: #fff; }
  button.ghost { background: #f1f5f9; color: #334155; }
  button.sm { padding: 3px 9px; font-size: 12px; border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
  th { color: #64748b; font-weight: 600; background: #f8fafc; white-space: nowrap; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: #eff6ff; color: #2563eb; white-space: nowrap; }
  .tag.miss { background: #fef3c7; color: #b45309; }
  .tag.sys { background: #f1f5f9; color: #64748b; }
  .muted { color: #94a3b8; }
  .err { color: #dc2626; }
  .ok { color: #059669; }
  .fmt { font-size: 12px; color: #94a3b8; margin-top: 6px; }
  .pager { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  #loginBox { max-width: 380px; margin: 40px auto; }
  #loginBox input { width: 100%; margin-bottom: 10px; }
  #loginBox button { width: 100%; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
  .openid { font-family: Consolas, monospace; font-size: 12px; color: #64748b; }
  .msg { max-width: 240px; word-break: break-all; }
  .rp { max-width: 360px; word-break: break-all; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>公众号机器人 · <span>消息记录</span></h1>

  <div id="loginBox" class="card">
    <div style="font-size:14px;margin-bottom:10px;">请输入管理员令牌</div>
    <input type="password" id="tokenInput" placeholder="管理员令牌" autocomplete="off">
    <button id="btnLogin">查询记录</button>
    <div id="loginMsg" class="fmt"></div>
  </div>

  <div id="mainBox" style="display:none;">
    <div class="card">
      <div class="bar">
        <div class="row" style="margin-bottom:0;">
          <input id="fQ" placeholder="搜索用户消息 / 回复内容" style="width:240px;">
          <select id="fKind">
            <option value="">全部类型</option>
            <option value="post">用户消息</option>
            <option value="get">服务器验证</option>
          </select>
          <button id="btnSearch">查询</button>
          <button class="ghost" id="btnRefresh">刷新</button>
        </div>
        <button class="ghost" id="btnLogout">退出</button>
      </div>

      <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>时间</th><th>用户</th><th>用户消息</th><th>回复类型</th><th>机器人回复内容</th></tr></thead>
          <tbody id="listBody"></tbody>
        </table>
      </div>
      <div class="pager">
        <button class="ghost sm" id="btnPrev">上一页</button>
        <span id="pageInfo" class="fmt"></span>
        <button class="ghost sm" id="btnNext">下一页</button>
      </div>
      <div class="fmt">说明：时间均为北京时间（UTC+8）；「回复内容」为部署本功能前的旧记录会显示为空；「签名错误」是外部扫描或测试请求，非真实用户消息；用户列的长字符串是 openid（微信对每个用户的加密匿名 ID）。</div>
    </div>
  </div>
</div>

<script>
(function () {
  var TOKEN_KEY = "wechat_logs_token";
  var $ = function (id) { return document.getElementById(id); };
  function token() { return sessionStorage.getItem(TOKEN_KEY) || ""; }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function tagClass(t) {
    if (t.indexOf("未命中") >= 0) return "miss";
    if (t.indexOf("事件") >= 0 || t.indexOf("验证") >= 0 || t.indexOf("无回复") >= 0) return "sys";
    return "";
  }

  function load() {
    $("mainBox").style.display = "block";
    var params = new URLSearchParams({
      q: $("fQ").value.trim(),
      kind: $("fKind").value,
      limit: 20,
      page: window.__page || 1
    });
    return fetch("/api/wechat/logs?" + params.toString(), {
      headers: { "Authorization": "Bearer " + token() }
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (!res.success) {
        if (res.error === "未授权") { logout(); $("loginMsg").innerHTML = '<span class="err">令牌错误</span>'; return; }
        $("listBody").innerHTML = '<tr><td colspan="5" class="err">' + esc(res.error) + '</td></tr>';
        return;
      }
      var body = $("listBody");
      if (!res.results.length) {
        body.innerHTML = '<tr><td colspan="5" class="muted">暂无记录</td></tr>';
      } else {
        body.innerHTML = res.results.map(function (r) {
          var rp = r.reply
            ? esc(r.reply)
            : (r.reply_type.indexOf("无回复") >= 0 || r.reply_type.indexOf("事件") >= 0 || r.reply_type.indexOf("验证") >= 0 || r.reply_type === "签名错误"
              ? '<span class="muted">-</span>'
              : '<span class="muted">（旧数据·未记录）</span>');
          return '<tr>' +
            '<td class="muted" style="white-space:nowrap;">' + esc(r.time) + '</td>' +
            '<td class="openid">' + esc(r.from_user || "-") + '</td>' +
            '<td class="msg">' + esc(r.user_msg || "-") + '</td>' +
            '<td><span class="tag ' + tagClass(r.reply_type) + '">' + esc(r.reply_type) + '</span></td>' +
            '<td class="rp">' + rp + '</td>' +
            '</tr>';
        }).join("");
      }
      var totalPage = Math.max(1, Math.ceil(res.total / res.limit));
      $("pageInfo").textContent = "共 " + res.total + " 条 · 第 " + res.page + " / " + totalPage + " 页";
      $("btnPrev").disabled = res.page <= 1;
      $("btnNext").disabled = res.page >= totalPage;
      window.__page = res.page;
      window.__totalPage = totalPage;
      $("mainBox").style.display = "block";
    }).catch(function (e) {
      $("listBody").innerHTML = '<tr><td colspan="5" class="err">加载失败：' + esc(e.message) + '</td></tr>';
    });
  }

  function logout() {
    sessionStorage.removeItem(TOKEN_KEY);
    $("mainBox").style.display = "none";
    $("loginBox").style.display = "block";
    $("tokenInput").value = "";
  }

  $("btnLogin").addEventListener("click", function () {
    var t = $("tokenInput").value.trim();
    if (!t) { $("loginMsg").innerHTML = '<span class="err">请输入令牌</span>'; return; }
    sessionStorage.setItem(TOKEN_KEY, t);
    $("loginBox").style.display = "none";
    window.__page = 1;
    load();
  });
  $("tokenInput").addEventListener("keydown", function (e) { if (e.key === "Enter") $("btnLogin").click(); });
  $("btnLogout").addEventListener("click", logout);
  $("btnSearch").addEventListener("click", function () { window.__page = 1; load(); });
  $("fQ").addEventListener("keydown", function (e) { if (e.key === "Enter") { window.__page = 1; load(); } });
  $("btnRefresh").addEventListener("click", function () { $("fQ").value = ""; $("fKind").value = ""; window.__page = 1; load(); });
  $("btnPrev").addEventListener("click", function () { if (window.__page > 1) { window.__page--; load(); } });
  $("btnNext").addEventListener("click", function () { if (window.__page < (window.__totalPage || 1)) { window.__page++; load(); } });

  if (token()) { $("loginBox").style.display = "none"; load(); }
})();
</script>
</body>
</html>
