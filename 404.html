<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面不存在 - 404 | 夸克网盘资源搜索</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .box { text-align: center; background: #fff; border-radius: 16px; padding: 48px 40px; box-shadow: 0 4px 24px rgba(0,0,0,.06); max-width: 460px; width: 100%; }
  .code { font-size: 64px; font-weight: 700; color: #1e90ff; line-height: 1; }
  .title { font-size: 20px; margin: 16px 0 8px; font-weight: 600; }
  .desc { font-size: 14px; color: #888; line-height: 1.7; }
  .btn { display: inline-block; margin-top: 24px; padding: 10px 28px; background: #1e90ff; color: #fff; border-radius: 20px; text-decoration: none; font-size: 14px; transition: background .2s; }
  .btn:hover { background: #0b7ae6; }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <div class="title">页面不存在</div>
