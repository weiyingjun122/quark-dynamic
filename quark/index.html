<body>
<nav class="navbar">
    <div class="navbar-inner">
        <a href="/" class="navbar-brand">实用资源整理站</a>
        <div class="navbar-links">
            <a href="/">首页</a>
            <a href="/tools/">工具</a>
            <a href="/quark/" class="active">资源搜索</a>
            <a href="/blog/">博客</a>
        </div>
    </div>
</nav>
<div class="user-panel" id="userPanel">
    <button class="user-btn" id="userBtn" onclick="showAuthModal()">登录/注册</button>
</div>
<div class="logo">
    <img src="/static/logo.png" alt="资源搜索" onerror="this.style.display='none'">
    <h1>资源搜索</h1>
</div>
<div class="search-container">
    <input type="text" id="searchInput" placeholder="请输入关键词搜索资源...">
    <button id="searchBtn">搜索</button>
</div>
<div id="hotKeywords" style="width:90%;max-width:900px;text-align:center;margin-bottom:20px;">
    <span style="color:#999;font-size:13px;">热门搜索：</span>
    <span class="hot-keyword" onclick="searchKeyword('PPT模板')">PPT模板</span>
    <span class="hot-keyword" onclick="searchKeyword('简历模板')">简历模板</span>
    <span class="hot-keyword" onclick="searchKeyword('Python教程')">Python教程</span>
    <span class="hot-keyword" onclick="searchKeyword('PS教程')">PS教程</span>
</div>
<div id="resultModal" class="modal">
    <div class="modal-content" style="width:480px;">
        <span class="close-btn" onclick="closeModal('resultModal')">&times;</span>
        <div id="resultModalBody"></div>
    </div>
</div>
<div id="qrModal" class="modal">
    <div class="modal-content" style="width:320px;">
        <span class="close-btn" onclick="closeModal('qrModal')">&times;</span>
        <div id="qrModalBody"></div>
    </div>
</div>
<div id="requestModal" class="modal">
    <div class="modal-content" style="width:400px;">
        <span class="close-btn" onclick="closeModal('requestModal')">&times;</span>
        <div id="requestModalBody"></div>
    </div>
</div>
<div id="authModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('authModal')">&times;</span>
        <div id="authModalBody"></div>
    </div>
</div>
<script>
let currentUser = null;
const TOKEN_KEY = 'quark_user_token';
const USER_KEY = 'quark_user_info';
let resultModal, resultModalBody, qrModal, qrModalBody, requestModal, requestModalBody, authModal, authModalBody, userPanel;
let allResources = [];
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

function getStoredAuth() {
    const token = localStorage.getItem(TOKEN_KEY);
    const user = localStorage.getItem(USER_KEY);
    if (token && user) {
        try { return { token, user: JSON.parse(user) }; } catch { return null; }
    }
    return null;
}

function saveAuth(token, user) {
    localStorage.setItem(TOKEN_KEY, token);
    localStorage.setItem(USER_KEY, JSON.stringify(user));
}

function clearAuth() {
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(USER_KEY);
    currentUser = null;
}

function updateUserPanel() {
    const auth = getStoredAuth();
    if (auth && auth.user) {
        currentUser = auth.user;
        const isVip = auth.user.isVip;
        const vipTag = isVip ? '<span style="background:gold;color:#333;padding:2px 8px;border-radius:10px;font-size:12px;margin-left:5px;">VIP</span>' : '';
        const transferInfo = isVip ? '<span class="transfer-count" style="background:gold;color:#333;">VIP无限次数</span>' : '<span class="transfer-count" id="transferCount">今日剩余: --</span>';
        userPanel.innerHTML = `<div class="user-info"><span class="username">${auth.user.username}</span>${vipTag}${transferInfo}<button class="logout-btn" onclick="handleLogout()">登出</button></div>`;
        if (!isVip) updateTransferStatus();
    } else {
        userPanel.innerHTML = `<button class="user-btn" id="userBtn" onclick="showAuthModal()">登录/注册</button>`;
    }
}

async function updateTransferStatus() {
    const auth = getStoredAuth();
    if (!auth) return;
    try {
        const res = await fetch('/api/auth/status', { headers: { 'Authorization': `Bearer ${auth.token}` } });
        const data = await res.json();
        if (data.success) {
            const countEl = document.getElementById('transferCount');
            if (countEl) {
                const remaining = Math.max(0, data.remaining);
                countEl.textContent = `今日剩余: ${remaining}次`;
                if (remaining === 0) { countEl.style.background = '#ffe0e0'; countEl.style.color = '#e74c3c'; }
            }
        }
    } catch (e) { console.warn('获取转存状态失败:', e.message); }
}

function closeModal(id) {
    document.getElementById(id).style.display = 'none';
}

function showAuthModal() {
    const auth = getStoredAuth();
    if (auth && auth.user) { updateUserPanel(); return; }
    authModalBody.innerHTML = `<h3 style="margin-top:0;color:#333;">用户登录</h3><div style="text-align:left;margin:20px 0;"><label style="display:block;margin-bottom:5px;color:#666;">用户名</label><input type="text" id="loginUsername" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:5px;box-sizing:border-box;" placeholder="请输入用户名"></div><div style="text-align:left;margin:20px 0;"><label style="display:block;margin-bottom:5px;color:#666;">密码</label><input type="password" id="loginPassword" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:5px;box-sizing:border-box;" placeholder="请输入密码"></div><button onclick="handleLogin()" style="width:100%;padding:12px;background:#1e90ff;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:16px;margin-bottom:10px;">登录</button><p style="color:#666;font-size:14px;">还没有账号？<a href="javascript:void(0)" onclick="showRegister()" style="color:#1e90ff;">立即注册</a></p>`;
    authModal.style.display = 'flex';
}

function showRegister() {
    authModalBody.innerHTML = `<h3 style="margin-top:0;color:#333;">用户注册</h3><div style="text-align:left;margin:20px 0;"><label style="display:block;margin-bottom:5px;color:#666;">用户名</label><input type="text" id="regUsername" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:5px;box-sizing:border-box;" placeholder="3-20个字符"></div><div style="text-align:left;margin:20px 0;"><label style="display:block;margin-bottom:5px;color:#666;">密码</label><input type="password" id="regPassword" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:5px;box-sizing:border-box;" placeholder="至少6个字符"></div><div style="text-align:left;margin:20px 0;"><label style="display:block;margin-bottom:5px;color:#666;">确认密码</label><input type="password" id="regConfirmPassword" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:5px;box-sizing:border-box;" placeholder="再次输入密码"></div><button onclick="handleRegister()" style="width:100%;padding:12px;background:#28a745;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:16px;margin-bottom:10px;">注册</button><p style="color:#666;font-size:14px;">已有账号？<a href="javascript:void(0)" onclick="showAuthModal()" style="color:#1e90ff;">立即登录</a></p>`;
}

async function handleRegister() {
    const username = document.getElementById('regUsername').value.trim();
    const password = document.getElementById('regPassword').value;
    const confirmPassword = document.getElementById('regConfirmPassword').value;
    if (!username || !password) { alert('请填写完整信息'); return; }
    if (password !== confirmPassword) { alert('两次密码输入不一致'); return; }
    let deviceId = localStorage.getItem('device_id');
    if (!deviceId) { deviceId = 'd_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9); localStorage.setItem('device_id', deviceId); }
    try {
        const res = await fetch('/api/auth/register?t=' + Date.now(), { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json', 'X-Device-ID': deviceId }, body: JSON.stringify({ username, password }) });
        const data = await res.json();
        if (data.success) { alert('注册成功，请登录'); showAuthModal(); } else { alert(data.error || '注册失败'); }
    } catch (e) { alert('网络错误: ' + e.message); }
}

async function handleLogin() {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!username || !password) { alert('请填写用户名和密码'); return; }
    try {
        const res = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
        const data = await res.json();
        if (data.success) { saveAuth(data.token, { userId: data.userId, username: data.username, isVip: data.isVip }); authModal.style.display = 'none'; updateUserPanel(); } else { alert(data.error || '登录失败'); }
    } catch (e) { alert('网络错误: ' + e.message); }
}

async function handleLogout() {
    const auth = getStoredAuth();
    if (auth) { try { await fetch('/api/auth/logout', { method: 'POST', headers: { 'Authorization': `Bearer ${auth.token}` } }); } catch (e) {} }
    clearAuth(); updateUserPanel();
}

async function loadResources() {
    try {
        const res = await fetch('/data.json');
        allResources = await res.json();
    } catch (e) {
        allResources = [];
    }
}

function searchKeyword(keyword) {
    document.getElementById('searchInput').value = keyword;
    performSearch();
}

function performSearch() {
    const keyword = document.getElementById('searchInput').value.trim();
    if (!keyword) return;
    
    const lowerKeyword = keyword.toLowerCase();
    const results = allResources.filter(item => {
        const title = (item.title || '').toLowerCase();
        const keywords = (item.keywords || []).join(' ').toLowerCase();
        const aliases = (item.search_aliases || []).join(' ').toLowerCase();
        return title.includes(lowerKeyword) || keywords.includes(lowerKeyword) || aliases.includes(lowerKeyword);
    });
    
    if (results.length > 0) {
        showResultModal(results, keyword);
    } else {
        showRequestModal(keyword);
    }
    
    fetch('/api/record', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ keyword: keyword }) }).catch(() => {});
}

function showResultModal(results, keyword) {
    let html = `<h3 style="margin-top:0;color:#333;">找到 ${results.length} 个相关资源</h3>`;
    html += `<p style="color:#666;font-size:13px;margin-bottom:10px;">关键词：${keyword}</p>`;
    html += `<div class="title-list">`;
    
    results.forEach((item, index) => {
        const title = item.title || '未知资源';
        const type = item.type || '';
        html += `<div class="title-item" onclick="handleTitleClick(${index})">
            <span class="name">${title}</span>
            ${type ? '<span class="type">' + type + '</span>' : ''}
            <span class="arrow">›</span>
        </div>`;
    });
    
    html += `</div>`;
    resultModalBody.innerHTML = html;
    resultModal.dataset.results = JSON.stringify(results);
    resultModal.style.display = 'flex';
}

function handleTitleClick(index) {
    const results = JSON.parse(resultModal.dataset.results || '[]');
    const item = results[index];
    if (!item) return;
    
    if (isMobile) {
        window.open(item.share_link || '#', '_blank');
    } else {
        showQrModal(item);
    }
}

function showQrModal(item) {
    const title = item.title || '未知资源';
    const qrcode = item.qrcode || '';
    const shareLink = item.share_link || '#';
    
    let html = `<div class="qr-modal-body">`;
    html += `<h3 style="margin-top:0;color:#333;font-size:16px;">${title}</h3>`;
    
    if (qrcode) {
        html += `<img src="/${qrcode}" alt="扫码获取">`;
        html += `<div class="hint">打开手机夸克 → 扫一扫 → 保存资源</div>`;
    } else {
        html += `<p style="color:#999;">暂无二维码</p>`;
        html += `<a href="${shareLink}" target="_blank" style="display:inline-block;margin-top:10px;padding:10px 20px;background:#1e90ff;color:#fff;border-radius:5px;text-decoration:none;">直接打开链接</a>`;
    }
    
    html += `</div>`;
    qrModalBody.innerHTML = html;
    qrModal.style.display = 'flex';
}

function showRequestModal(keyword) {
    let html = `<div class="request-modal-body">`;
    html += `<h3 style="margin-top:0;color:#333;">未找到相关资源</h3>`;
    html += `<p style="color:#666;font-size:14px;margin-bottom:10px;">抱歉，没有找到"${keyword}"相关资源</p>`;
    html += `<button class="request-btn" onclick="sendToWechat('${keyword}')">求资源</button>`;
    html += `<p style="color:#999;font-size:12px;margin-top:15px;">点击按钮发送需求到企业微信</p>`;
    html += `<img src="/static/wechat_qrcode.png" alt="微信群二维码" onerror="this.style.display='none'" style="max-width:180px;margin-top:15px;border-radius:8px;">`;
    html += `<p style="color:#999;font-size:12px;">或扫码加入微信群</p>`;
    html += `</div>`;
    
    requestModalBody.innerHTML = html;
    requestModal.style.display = 'flex';
}

function sendToWechat(keyword) {
    const wechatApiUrl = 'https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=YOUR_KEY_HERE';
    
    fetch(wechatApiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            msgtype: 'text',
            text: {
                content: `【资源请求】\n用户请求资源：${keyword}\n来源：资源搜索页面\n时间：${new Date().toLocaleString('zh-CN')}`
            }
        })
    }).then(() => {
        alert('已发送需求，我们会尽快处理！');
        closeModal('requestModal');
    }).catch(() => {
        alert('发送失败，请稍后重试');
    });
}

document.addEventListener('DOMContentLoaded', () => {
    resultModal = document.getElementById('resultModal');
    resultModalBody = document.getElementById('resultModalBody');
    qrModal = document.getElementById('qrModal');
    qrModalBody = document.getElementById('qrModalBody');
    requestModal = document.getElementById('requestModal');
    requestModalBody = document.getElementById('requestModalBody');
    authModal = document.getElementById('authModal');
    authModalBody = document.getElementById('authModalBody');
    userPanel = document.getElementById('userPanel');
    updateUserPanel();
    loadResources();
    
    document.getElementById('searchBtn').addEventListener('click', performSearch);
    document.getElementById('searchInput').addEventListener('keypress', e => { if(e.key==='Enter') performSearch(); });
    
    const urlParams = new URLSearchParams(window.location.search);
    const q = urlParams.get('q');
    if (q) { document.getElementById('searchInput').value = q; setTimeout(performSearch, 500); }
});
</script>
</body>
</html>
