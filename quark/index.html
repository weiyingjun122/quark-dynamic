let currentUser = null;
const TOKEN_KEY = 'quark_user_token';
const USER_KEY = 'quark_user_info';
let resultModal, resultModalBody, qrModal, qrModalBody, requestModal, requestModalBody, authModal, authModalBody, userPanel;
let allResources = [];
let todayUpdates = [];
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || ('ontouchstart' in window && navigator.maxTouchPoints > 0) || (window.innerWidth <= 768);

async function loadTodayUpdates() {
    try {
        const res = await fetch('/update.json?v=' + Date.now());
        const updates = await res.json();
        todayUpdates = updates.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        if (todayUpdates.length > 0) {
            const hint = document.getElementById('updateHint');
            const countText = document.getElementById('updateCountText');
            const list = document.getElementById('updateList');

const HISTORY_KEY = 'quark_search_history';

}

function saveSearchHistory(keyword) {
    if (!keyword) return;
    let history = getSearchHistory();
    history = history.filter(item => item !== keyword);
    history.unshift(keyword);
    if (history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY);

function getGuessList(keyword) {

    const lowerKeyword = (keyword || '').toLowerCase();
    let pool = allResources;
    if (lowerKeyword) {
        pool = allResources.filter(item => {
            const title = (item.title || '').toLowerCase();
            const keywords = (item.keywords || []).join(' ').toLowerCase();
            return title.includes(lowerKeyword) || keywords.includes(lowerKeyword);
        });
    }
    if (pool.length === 0) pool = allResources;
    const shuffled = pool.sort(() => 0.5 - Math.random());
    return shuffled.slice(0, 5);
}

        alert('链接已复制到剪贴板');
        closeModal('shareModal');
    }).catch(() => {
        const input = document.createElement('input');
        input.value = url;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');

        alert('链接已复制到剪贴板');
        closeModal('shareModal');

    currentCount = count;
    document.querySelectorAll('.count-tag').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    
    browseByFilter();
}

function browseByFilter() {
    const keyword = document.getElementById('searchInput').value.trim();
    if (keyword) {
        performSearch();
        return;
    }
    
    if (!resourcesLoaded) {
        alert('资源加载中，请稍后再试');
        return;
    }
    
    let results = allResources;
    if (currentCategory !== 'all') {
        results = results.filter(item => item.type === currentCategory);
    }
    if (currentCategory === '剧本杀' && currentCount !== 'all') {
        results = results.filter(item => item.count === currentCount);
    }
    
    if (results.length > 0) {
        showResultModal(results, currentCategory === 'all' ? '全部资源' : currentCategory);
    } else {
        showRequestModal(currentCategory === 'all' ? '' : currentCategory);
    }
}

}

}

async function updateTransferStatus() {
    const auth = getStoredAuth();
    if (!auth) return;
    try {
        const res = await fetch('/api/auth/status', { headers: { 'Authorization': `Bearer ${auth.token}` } });
        const data = await res.json();
        if (data.success) {
            const countEl = document.getElementById('transferCount');
            if (countEl) {
                const remaining = Math.max(0, data.remaining);
                countEl.textContent = `今日剩余: ${remaining}次`;
                if (remaining === 0) { countEl.style.background = '#ffe0e0'; countEl.style.color = '#e74c3c'; }
            }
        }
    } catch (e) { console.warn('获取转存状态失败:', e.message); }
}

async function handleRegister() {
    const username = document.getElementById('regUsername').value.trim();
    const password = document.getElementById('regPassword').value;
    const confirmPassword = document.getElementById('regConfirmPassword').value;
    if (!username || !password) { alert('请填写完整信息'); return; }
    if (password !== confirmPassword) { alert('两次密码输入不一致'); return; }
    let deviceId = localStorage.getItem('device_id');
    if (!deviceId) { deviceId = 'd_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9); localStorage.setItem('device_id', deviceId); }
    try {
        const res = await fetch('/api/auth/register?t=' + Date.now(), { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json', 'X-Device-ID': deviceId }, body: JSON.stringify({ username, password }) });
        const data = await res.json();
        if (data.success) { alert('注册成功，请登录'); showAuthModal(); } else { alert(data.error || '注册失败'); }
    } catch (e) { alert('网络错误: ' + e.message); }
}

async function handleLogin() {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!username || !password) { alert('请填写用户名和密码'); return; }
    try {
        const res = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
        const data = await res.json();
        if (data.success) { saveAuth(data.token, { userId: data.userId, username: data.username, isVip: data.isVip }); authModal.style.display = 'none'; updateUserPanel(); } else { alert(data.error || '登录失败'); }
    } catch (e) { alert('网络错误: ' + e.message); }
}

async function handleLogout() {
    const auth = getStoredAuth();
    if (auth) { try { await fetch('/api/auth/logout', { method: 'POST', headers: { 'Authorization': `Bearer ${auth.token}` } }); } catch (e) {} }
    clearAuth(); updateUserPanel();
}

function searchKeyword(keyword) {
    clearTimeout(searchTimer);
    document.getElementById('searchInput').value = keyword;
    performSearch();
}

function performSearch() {
    const keyword = document.getElementById('searchInput').value.trim();
    if (!keyword) { updateSeoTitle(null); return; }
    
    if (!resourcesLoaded) {
        alert('资源加载中，请稍后再试');
        return;
    }
    
    saveSearchHistory(keyword);
    
    const lowerKeyword = keyword.toLowerCase();
    let results = allResources.filter(item => {
        const title = (item.title || '').toLowerCase();
        const keywords = (item.keywords || []).join(' ').toLowerCase();
        const aliases = (item.search_aliases || []).join(' ').toLowerCase();
        return title.includes(lowerKeyword) || keywords.includes(lowerKeyword) || aliases.includes(lowerKeyword);
    });
    
    if (currentCategory !== 'all') {
        results = results.filter(item => item.type === currentCategory);
    }
    
    if (currentCategory === '剧本杀' && currentCount !== 'all') {
        results = results.filter(item => item.count === currentCount);
    }
    
    if (results.length > 0) {
        showResultModal(results, keyword);
    } else if (isManualSearch) {
        showRequestModal(keyword);
    }
    
    fetch('/api/record', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ keyword: keyword }) }).catch(() => {});
}

let searchTimer = null;
let isManualSearch = false;
function debounceSearch() {
    clearTimeout(searchTimer);
    isManualSearch = false;
    searchTimer = setTimeout(() => {
        const keyword = document.getElementById('searchInput').value.trim();
        if (keyword && keyword.length >= 2) {
            performSearch();
        }
    }, 300);
}

function showResultModal(results, keyword) {
    let html = `<h3 style="margin-top:0;color:#333;">找到 ${results.length} 个相关资源</h3>`;
    html += `<p style="color:#666;font-size:13px;margin-bottom:10px;">关键词：${keyword}</p>`;
    html += `<div style="margin-bottom:10px;text-align:right;"><button class="batch-select-btn" onclick="toggleBatchMode()">批量收藏</button></div>`;
    html += `<div class="title-list" id="resultList">`;
    
    results.forEach((item, index) => {
        const title = item.title || '未知资源';
        const type = item.type || '';
        const count = item.count;
        const keywords = (item.keywords || []).slice(0, 3).join(' · ');
        const isFav = isFavorite(item.id);
        let desc = '';
        if (type === '剧本杀' && count) {
            desc = `<span style="font-size:11px;color:#e74c3c;margin-left:6px;">${count}人本</span>`;
        } else if (keywords) {
            desc = `<span style="font-size:11px;color:#999;margin-left:6px;">${keywords}</span>`;
        }
        let extraDesc = '';
        if (type && type !== '剧本杀') {
            extraDesc = `<div class="resource-desc">${type}资源 · ${keywords || '高质量资源'}</div>`;
        } else if (type === '剧本杀') {
            extraDesc = `<div class="resource-desc">${count}人剧本杀 · 推理体验</div>`;
        }
        html += `<div class="title-item" style="flex-wrap:wrap;">
            <span class="name" onclick="handleTitleClick(${index})">${title}</span>
            ${type ? '<span class="type">' + type + '</span>' : ''}
            ${desc}
            ${extraDesc}
            <div style="display:flex;align-items:center;gap:4px;">
                <input type="checkbox" class="checkbox-item" onchange="toggleSelectItem('${item.id}', this)" ${batchMode ? '' : 'style="display:none"'}>
                <button class="fav-btn ${isFav ? 'active' : ''}" onclick="event.stopPropagation();toggleFavorite('${item.id}','${(title).replace(/'/g, "\\'")}','${type}',this)" title="收藏">♥</button>
                <button style="background:none;border:none;cursor:pointer;font-size:12px;color:#1e90ff;padding:0 4px;" onclick="event.stopPropagation();shareResource('${(title).replace(/'/g, "\\'")}','${(item.share_link || '').replace(/'/g, "\\'")}')" title="分享">↗</button>
                <span class="arrow" onclick="handleTitleClick(${index})">›</span>
            </div>
        </div>`;
    });
    
    html += `</div>`;
    
    const auth = getStoredAuth();
    if (!auth) {
        html += `<p style="color:#999;font-size:12px;margin-top:10px;padding-top:10px;border-top:1px solid #f0f0f0;">登录后即可免费查看资源（每日2次）<a href="javascript:void(0)" onclick="closeModal('resultModal');showAuthModal();" style="color:#1e90ff;margin-left:5px;">立即登录</a></p>`;
    }
    
    resultModalBody.innerHTML = html;
    resultModal.dataset.results = JSON.stringify(results);
    resultModal.style.display = 'flex';
    updateSeoTitle(keyword);
}

function handleTitleClick(index) {
    const results = JSON.parse(resultModal.dataset.results || '[]');
    const item = results[index];
    if (!item) return;
    
    const auth = getStoredAuth();
    if (!auth) {
        closeModal('resultModal');
        showAuthModal();
        return;
    }
    
    checkAndViewResource(item);
}

async function checkAndViewResource(item) {
    const auth = getStoredAuth();
    if (!auth) return;
    
    try {
        const res = await fetch('/api/auth/check', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + auth.token
            }
        });
        const data = await res.json();
        
        if (data.success && data.allowed) {
            showQrModal(item);
            updateTransferStatus();
        } else {
            alert(data.error || '今天查看次数已用完，明天再来吧！');
        }
    } catch (e) {
        alert('网络错误，请稍后重试');
    }
}

function showQrModal(item) {
    const title = item.title || '未知资源';
    const qrcode = item.qrcode || '';
    const shareLink = item.share_link || '#';
    const viewCount = getViewCount(item.id);
    
    let html = `<div class="qr-modal-body">`;
    html += `<h3 style="margin-top:0;color:#333;font-size:16px;">${title}</h3>`;
    html += `<div class="view-count">已有 ${viewCount} 人查看</div>`;
    
    if (isMobile) {
        html += `<a href="${shareLink}" target="_blank" style="display:inline-block;margin-top:15px;padding:14px 28px;background:#1e90ff;color:#fff;border-radius:25px;text-decoration:none;font-size:15px;">打开夸克网盘链接</a>`;
        html += `<div class="hint" style="margin-top:10px;">点击链接直接转存资源</div>`;
    } else {
        if (qrcode) {
            html += `<img src="/${qrcode}" alt="扫码获取">`;
            html += `<div class="hint">打开手机夸克 → 扫一扫 → 保存资源</div>`;
        } else {
            html += `<a href="${shareLink}" target="_blank" style="display:inline-block;margin-top:15px;padding:14px 28px;background:#1e90ff;color:#fff;border-radius:25px;text-decoration:none;font-size:15px;">打开夸克网盘链接</a>`;
        }
    }
    
    html += `<div style="margin-top:15px;"><button onclick="closeModal('qrModal')" style="padding:8px 20px;background:#f0f0f0;color:#666;border:none;border-radius:20px;cursor:pointer;font-size:13px;">返回继续搜索</button></div>`;
    
    html += `</div>`;
    qrModalBody.innerHTML = html;
    qrModal.style.display = 'flex';
    recordView(item.id);
}

function showRequestModal(keyword) {
    const guessList = getGuessList(keyword);
    let html = `<div class="request-modal-body">`;
    html += `<h3 style="margin-top:0;color:#333;">未找到相关资源</h3>`;
    html += `<p style="color:#666;font-size:14px;margin-bottom:15px;">抱歉，没有找到"${keyword}"相关资源</p>`;
    html += `<button class="request-btn" onclick="sendToWechat('${keyword.replace(/'/g, "\\'")}')">求资源</button>`;
    html += `<img src="/static/wechat_qrcode.png?t=${Date.now()}" alt="微信群二维码" onerror="this.style.display='none'">`;
    html += `<p style="color:#999;font-size:12px;margin-top:10px;">扫码加入微信群获取资源</p>`;
    
    if (guessList.length > 0) {
        html += `<div class="guess-list">`;
        html += `<div class="guess-title">猜你想搜：</div>`;
        guessList.forEach(item => {
            html += `<div class="guess-item" onclick="closeModal('requestModal');searchKeyword('${(item.title || '').replace(/'/g, "\\'")}')">${item.title || '未知资源'}</div>`;
        });
        html += `</div>`;
    }
    
    html += `</div>`;
    
    requestModalBody.innerHTML = html;
    requestModal.style.display = 'flex';
}

function sendToWechat(keyword) {
    fetch('/api/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ keyword: keyword })
    }).then(res => {
        console.log('Response status:', res.status);
        return res.json();
    }).then(data => {
        console.log('Response data:', data);
        if (data.success) {
            alert('已发送需求，我们会尽快处理！');
            closeModal('requestModal');
        } else {
            alert('发送失败：' + (data.error || '请稍后重试'));
        }
    }).catch(err => {
        console.error('Fetch error:', err);
        alert('网络错误：' + err.message);
    });
}

document.addEventListener('DOMContentLoaded', () => {
    resultModal = document.getElementById('resultModal');
    resultModalBody = document.getElementById('resultModalBody');
    qrModal = document.getElementById('qrModal');
    qrModalBody = document.getElementById('qrModalBody');
    requestModal = document.getElementById('requestModal');
    requestModalBody = document.getElementById('requestModalBody');
    authModal = document.getElementById('authModal');
    authModalBody = document.getElementById('authModalBody');
    userPanel = document.getElementById('userPanel');
    updateUserPanel();
    loadResources();
    loadTodayUpdates();
    renderSearchHistory();
    
    document.getElementById('searchBtn').addEventListener('click', () => { isManualSearch = true; clearTimeout(searchTimer); performSearch(); });
    document.getElementById('searchInput').addEventListener('keypress', e => { if(e.key==='Enter') { isManualSearch = true; clearTimeout(searchTimer); performSearch(); } });
    document.getElementById('searchInput').addEventListener('input', debounceSearch);
    
    const urlParams = new URLSearchParams(window.location.search);
    const q = urlParams.get('q');
    if (q) { document.getElementById('searchInput').value = q; setTimeout(performSearch, 500); }
    
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/quark/sw.js').catch(() => {});
    }
});
</script>
</body>
</html>
