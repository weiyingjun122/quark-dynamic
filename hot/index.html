<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>热搜资源榜｜每日更新</title>
<meta name="description" content="热门资源搜索榜，实时统计大家都在搜什么，学习资料、模板、工具一站直达。">
<meta name="keywords" content="热搜榜,热门搜索,资源搜索,学习资料">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="canonical" href="https://www.weiyingjun.top/hot/">
<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f6f7fb; margin: 0; padding: 20px; padding-top: 80px; }
.navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.08); height: 56px; display: flex; align-items: center; justify-content: center; }
.navbar-inner { width: 100%; max-width: 900px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
.navbar-brand { font-size: 16px; font-weight: bold; color: #1e90ff; text-decoration: none; }
.navbar-links { display: flex; gap: 24px; position: absolute; left: 50%; transform: translateX(-50%); }
.navbar-links a { text-decoration: none; color: #333; font-size: 15px; padding: 6px 0; border-bottom: 2px solid transparent; transition: all 0.2s; }
.navbar-links a:hover, .navbar-links a.active { color: #1e90ff; border-bottom-color: #1e90ff; }
.container { max-width: 720px; margin: auto; }
h1 { text-align: center; font-size: 22px; }
.subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px; }
.hot-list { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
.hot-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
.hot-item:last-child { border-bottom: none; }
.rank { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; margin-right: 12px; flex-shrink: 0; background: #f0f0f0; color: #999; }
.rank.top1 { background: #ff4d4f; color: #fff; }
.rank.top2 { background: #ff7a45; color: #fff; }
.rank.top3 { background: #ffa940; color: #fff; }
.hot-item a { color: #333; text-decoration: none; font-size: 15px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hot-item a:hover { color: #1e90ff; }
.count { color: #999; font-size: 13px; margin-left: 8px; white-space: nowrap; }
.level { font-size: 13px; margin-left: 6px; white-space: nowrap; }
.footer { margin-top: 20px; text-align: center; font-size: 13px; color: #999; }
.footer a { color: #1e90ff; text-decoration: none; }
.loading { text-align: center; color: #999; padding: 40px 0; }
.empty { text-align: center; color: #999; padding: 40px 0; }
.error { text-align: center; color: #ff4d4f; padding: 40px 0; }
</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6726656035929687" crossorigin="anonymous"></script>
</head>
<body>
<nav class="navbar">
    <div class="navbar-inner">
        <a href="/" class="navbar-brand">实用资源整理站</a>
        <div class="navbar-links">
            <a href="/">首页</a>
            <a href="/tools/">工具</a>
            <a href="/quark/">资源搜索</a>
            <a href="/blog/">博客</a>
        </div>
    </div>
</nav>
<div class="container">
    <h1>🔥 热搜资源榜</h1>
    <p class="subtitle">实时统计全站用户最常搜索的资源关键词</p>

    <div class="hot-list" id="hotList">
        <div class="loading">加载中...</div>
    </div>

    <div class="footer">
        <p>数据来自全站用户搜索统计，每 5 分钟自动更新</p>
        <a href="/quark/">前往搜索</a> | <a href="/">返回首页</a>
    </div>
</div>

<script>
async function fetchHotList() {
    try {
        const res = await fetch('/api/hot');
        if (!res.ok) throw new Error('请求失败');
        return await res.json();
    } catch (e) {
        return null;
    }
}

function render(list) {
    const box = document.getElementById('hotList');

    if (list === null) {
        box.innerHTML = '<div class="error">数据加载失败，请稍后刷新重试</div>';
        return;
    }

    if (!list.length) {
        box.innerHTML = '<div class="empty">暂无热搜数据，快去搜索你想找的资源吧！</div>';
        return;
    }

    let html = '';
    list.forEach((item, i) => {
        const rankClass = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
        html += `
        <div class="hot-item">
            <div class="rank ${rankClass}">${i + 1}</div>
            <a href="/quark/?q=${encodeURIComponent(item.word)}" title="${item.word} 资源搜索">${item.word}</a>
            <span class="count">${item.count} 次</span>
            <span class="level">${item.level}</span>
        </div>`;
    });

    box.innerHTML = html;
}

async function load() {
    const list = await fetchHotList();
    render(list);
}

load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
