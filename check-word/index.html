<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>违禁词检测工具 - AI/咸鱼/抖音/小红书违禁词检测</title>
<meta name="description" content="在线检测 AI、咸鱼、抖音、小红书平台的违禁词、敏感词、极限词，输入文本一键标红，发布前快速排查合规风险。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23e5484d'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white'%3E%E6%A3%80%3C/text%3E%3C/svg%3E">

<body>
<header class="site-header">
  <div class="container">
    <h1>违禁词检测工具</h1>
    <p class="subtitle">在线检测 <b>AI / 咸鱼 / 抖音 / 小红书</b> 平台违禁词、敏感词、极限词，命中词自动标红</p>
  </div>
</header>

<main class="container">
  <div class="tool-card">

    <div class="toolbar">
      <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="ai">AI 违禁词</button>
        <button class="tab" data-tab="xianyu">咸鱼违禁词</button>
        <button class="tab" data-tab="douyin">抖音违禁词</button>
        <button class="tab" data-tab="xiaohongshu">小红书违禁词</button>
      </nav>
      <div class="actions">
        <button id="btnQr" class="action-btn" title="生成当前页面二维码">二维码</button>
        <button id="btnDonate" class="action-btn" title="支持本站">打赏支持</button>
        <button id="btnCopyLink" class="action-btn" title="复制带当前文本的链接">复制链接</button>
      </div>
    </div>

    <div class="panel input-panel">
      <textarea id="input" spellcheck="false" placeholder="在此粘贴或输入要检测的文本，点击「开始检查」自动标红违规词…"></textarea>
      <div class="input-meta">
        <span id="charCount">0 字</span>
        <div class="btn-group">
          <button id="btnCheck" class="btn primary">开始检查</button>
          <button id="btnCopyResult" class="btn">复制结果</button>
          <button id="btnReset" class="btn">清空</button>
        </div>
      </div>
    </div>

    <div class="panel result-panel" id="resultPanel" style="display:none">
      <div class="result-header">
        <span>检测结果</span>
        <span id="hitSummary" class="hit-summary"></span>
      </div>
      <div id="result" class="result-content" contenteditable="true" data-placeholder="检测结果将显示在这里"></div>
    </div>

    <div class="panel custom-panel" id="customPanel" style="display:none">
      <label for="customWords">自定义违禁词（每行一个，仅保存在本浏览器）</label>
      <textarea id="customWords" rows="3" spellcheck="false" placeholder="补充检测词，每行一个，例如：&#10;免费送&#10;包过"></textarea>
      <button id="btnSaveCustom" class="btn">保存自定义词</button>
      <span id="customTip" class="tip"></span>
    </div>

  </div>

  <div class="disclaimer">
    本工具基于公开词库进行关键词匹配，检测结果仅供参考，不构成平台官方判定。发布前请以各平台最新规则为准。
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <p>词库由开源词库每周自动同步更新，全程无需人工维护。</p>
  </div>
</footer>

<!-- 二维码弹窗 -->
<div class="modal" id="qrModal">
  <div class="modal-box">
    <h3>扫码访问</h3>
    <div id="qrcode"></div>
    <p class="modal-tip">用手机扫一扫，即可访问本工具</p>
    <button class="btn close-modal" data-close="qrModal">关闭</button>
  </div>
</div>
